name: Merge Acceptance

on:
  pull_request:
  workflow_dispatch:

jobs:
  merge-acceptance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v14

      - name: Full render via nix build
        run: nix build
