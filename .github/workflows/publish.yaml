name: Deploy Rendered Site

on:
  workflow_dispatch:
  push:
    branches:
      - '**'

env:
  CARGO_TERM_COLOR: always

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run
# in-progress and latest queued. However, do NOT cancel in-progress runs as we
# want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  check-deploy-branch:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.branch-policy.outputs.should_deploy }}
    steps:
      - name: Evaluate github-pages deployment branch policy
        id: branch-policy
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REF_PROTECTED: ${{ github.ref_protected }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "should_deploy=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          env_response="$(
            GH_TOKEN="${GITHUB_TOKEN}" gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/environments/github-pages"
          )"

          custom_branch_policies="$(
            python -c 'import json,sys; print(str(json.loads(sys.stdin.read()).get("deployment_branch_policy", {}).get("custom_branch_policies", False)).lower())' \
              <<< "${env_response}"
          )"

          protected_branches_only="$(
            python -c 'import json,sys; print(str(json.loads(sys.stdin.read()).get("deployment_branch_policy", {}).get("protected_branches", False)).lower())' \
              <<< "${env_response}"
          )"

          if [ "${custom_branch_policies}" = "true" ]; then
            policy_response="$(
              GH_TOKEN="${GITHUB_TOKEN}" gh api \
                -H "Accept: application/vnd.github+json" \
                "/repos/${GITHUB_REPOSITORY}/environments/github-pages/deployment-branch-policies?per_page=100"
            )"

            if POLICY_RESPONSE="${policy_response}" BRANCH_NAME="${GITHUB_REF_NAME}" python -c '
import fnmatch
import json
import os
import sys

branch = os.environ["BRANCH_NAME"]
policies = json.loads(os.environ["POLICY_RESPONSE"]).get("branch_policies", [])
for policy in policies:
    name = policy.get("name")
    if name and fnmatch.fnmatch(branch, name):
        sys.exit(0)
sys.exit(1)
'
            then
              echo "should_deploy=true" >> "${GITHUB_OUTPUT}"
            else
              echo "should_deploy=false" >> "${GITHUB_OUTPUT}"
            fi
          elif [ "${protected_branches_only}" = "true" ]; then
            if [ "${GITHUB_REF_PROTECTED}" = "true" ]; then
              echo "should_deploy=true" >> "${GITHUB_OUTPUT}"
            else
              echo "should_deploy=false" >> "${GITHUB_OUTPUT}"
            fi
          else
            echo "should_deploy=true" >> "${GITHUB_OUTPUT}"
          fi

  render-and-deploy:
    needs: check-deploy-branch
    if: needs.check-deploy-branch.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Compile ZIPs and Zcash Protocol Specification
        uses: ./.github/actions/render

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: 'rendered'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
