name: Publish multi-branch docs

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    uses: shielded-nate/multi-branch-pages/.github/workflows/publish-multi-branch-pages.yml@v1
    with:
      branch_whitelist: "*"
      render_command: nix develop --command make all-zips
      render_output_dir: rendered/
